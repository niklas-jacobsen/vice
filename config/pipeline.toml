# Runtime configuration. Keys must match ambient.config.Config; unknown keys are an error.
# Thresholds fitted by `python -m ambient.eval.calibrate` live in calibration.json and
# override the matching keys here.

model = "jev-1.14.0"

# Chosen by `python -m ambient.eval.prefilter` (see reports/prefilter.json).
embedder = "minilm"
store = "numpy"
hybrid = true
top_k = 20

token_budget = 400
# The design target was 100 ms. Measured from this machine (reports/latency.json), a warm
# gate request takes 165 ms p50 / ~200 ms p95 and never came in under 134 ms, so a 100 ms
# budget would suppress every event. 300 ms covers the observed tail.
gate_timeout_ms = 300
