[project]
name = "vice-ai"
version = "0.1.1"
description = "Context retrieval engine for AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Niklas Jacobsen" }]
requires-python = ">=3.12"
keywords = ["retrieval", "context", "agents", "mcp", "obsidian", "typesafe", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typesafe-sdk[http2]>=0.7.5",
    "numpy",
    "onnxruntime",
    "tokenizers",
    "huggingface_hub",
    "bm25s",
    "opentelemetry-sdk",
    "keyring",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
eval = ["scikit-learn", "fastembed", "tiktoken", "model2vec", "sqlite-vec", "lancedb", "hnswlib"]
dev = ["pytest", "pytest-asyncio", "build"]

[project.urls]
Homepage = "https://github.com/niklas-jacobsen/vice"
Issues = "https://github.com/niklas-jacobsen/vice/issues"

[project.scripts]
vice = "vice_ai.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vice_ai = ["default_calibration.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
