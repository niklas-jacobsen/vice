<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="A prompt enters vice, which decides whether it needs context, retrieves and judges blocks from the sources, selects the final set, and passes relevant blocks or nothing to the agent. The agent can also call recall over MCP mid-task." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656c76"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4493f8"/></marker></defs><rect x="170" y="62" width="560" height="140" rx="12" fill="#0d1a2e" stroke="#4493f8" stroke-width="1.5"/><text x="188" y="86" font-size="14" font-weight="700" fill="#4493f8" text-anchor="start">vice</text><rect x="190" y="104" width="160" height="76" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="270.0" y="139.0" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle">Needs context?</text><text x="270.0" y="157.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">gate</text><rect x="370" y="104" width="160" height="76" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="450.0" y="139.0" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle">Retrieve</text><text x="450.0" y="157.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">judge relevance</text><rect x="550" y="104" width="160" height="76" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="630.0" y="139.0" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle">Select</text><text x="630.0" y="157.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">final set</text><path d="M350 142 L368 142" fill="none" stroke="#656c76" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a)"/><path d="M530 142 L548 142" fill="none" stroke="#656c76" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a)"/><rect x="20" y="114" width="120" height="56" rx="28.0" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="80.0" y="147.0" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle">Prompt</text><path d="M140 142 L188 142" fill="none" stroke="#656c76" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a)"/><rect x="370" y="254" width="160" height="56" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="450.0" y="279.0" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle">Sources</text><text x="450.0" y="297.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">vaults, folders, JSONL</text><path d="M450 254 L450 182" fill="none" stroke="#656c76" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="458" y="224" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">indexed locally</text><rect x="810" y="114" width="130" height="56" rx="28.0" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/><text x="875.0" y="147.0" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle">Agent</text><path d="M710 142 L808 142" fill="none" stroke="#4493f8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#b)"/><text x="772" y="132" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">blocks</text><text x="772" y="160" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">or nothing</text><path d="M875 114 L875 30 L270 30 L270 102" fill="none" stroke="#656c76" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#a)"/><text x="572" y="22" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">recall over MCP, mid-task</text></svg>
